name: RepoInvariant
description: Catch environment, traceability, and Java version contract drift before merge.
author: xixvivji

branding:
  icon: check-circle
  color: purple

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  config:
    description: Optional repository-relative configuration path.
    required: false
    default: ""
  format:
    description: Report format (text, json, markdown, or sarif).
    required: false
    default: text
  output:
    description: Optional report output path.
    required: false
    default: ""
  baseline:
    description: Optional repository-relative baseline file for gradual adoption.
    required: false
    default: ""
  fail-on:
    description: Minimum blocking severity (error or warning).
    required: false
    default: error
  strict:
    description: Run doctor --strict before checking contracts.
    required: false
    default: "false"
  no-env:
    description: Set to true to skip environment-contract checks.
    required: false
    default: "false"
  no-features:
    description: Set to true to skip feature-traceability checks.
    required: false
    default: "false"
  no-versions:
    description: Set to true to skip Java version-contract checks.
    required: false
    default: "false"

outputs:
  status:
    description: Scan result after baseline filtering and fail-on (pass or fail).
    value: ${{ steps.check.outputs.status }}
  errors:
    description: Number of reported (unsuppressed) error findings.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: Number of reported (unsuppressed) warning findings.
    value: ${{ steps.check.outputs.warnings }}
  report-path:
    description: Safe workspace-relative report path, or empty when unavailable.
    value: ${{ steps.check.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Sync locked RepoInvariant action dependencies
      shell: bash
      env:
        REPOINVARIANT_ACTION_PATH: ${{ github.action_path }}
      run: uv sync --project "$REPOINVARIANT_ACTION_PATH" --frozen --no-dev
    - name: Check repository contracts
      id: check
      shell: bash
      env:
        REPOINVARIANT_PATH: ${{ inputs.path }}
        REPOINVARIANT_CONFIG: ${{ inputs.config }}
        REPOINVARIANT_FORMAT: ${{ inputs.format }}
        REPOINVARIANT_OUTPUT: ${{ inputs.output }}
        REPOINVARIANT_BASELINE: ${{ inputs.baseline }}
        REPOINVARIANT_FAIL_ON: ${{ inputs.fail-on }}
        REPOINVARIANT_STRICT: ${{ inputs.strict }}
        REPOINVARIANT_NO_ENV: ${{ inputs.no-env }}
        REPOINVARIANT_NO_FEATURES: ${{ inputs.no-features }}
        REPOINVARIANT_NO_VERSIONS: ${{ inputs.no-versions }}
        REPOINVARIANT_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -Eeuo pipefail

        selection_args=()
        if [[ -n "$REPOINVARIANT_CONFIG" ]]; then
          selection_args+=("--config=$REPOINVARIANT_CONFIG")
        fi
        if [[ -n "$REPOINVARIANT_BASELINE" ]]; then
          selection_args+=("--baseline=$REPOINVARIANT_BASELINE")
        fi

        case "$REPOINVARIANT_NO_ENV" in
          true) selection_args+=(--no-env) ;;
          false) ;;
          *) printf 'no-env must be true or false, got %q\n' "$REPOINVARIANT_NO_ENV" >&2; exit 2 ;;
        esac
        case "$REPOINVARIANT_NO_FEATURES" in
          true) selection_args+=(--no-features) ;;
          false) ;;
          *) printf 'no-features must be true or false, got %q\n' "$REPOINVARIANT_NO_FEATURES" >&2; exit 2 ;;
        esac
        case "$REPOINVARIANT_NO_VERSIONS" in
          true) selection_args+=(--no-versions) ;;
          false) ;;
          *) printf 'no-versions must be true or false, got %q\n' "$REPOINVARIANT_NO_VERSIONS" >&2; exit 2 ;;
        esac
        case "$REPOINVARIANT_STRICT" in
          true)
            doctor_args=(doctor --strict)
            if (( ${#selection_args[@]} )); then
              doctor_args+=("${selection_args[@]}")
            fi
            doctor_args+=(-- "$REPOINVARIANT_PATH")
            uv run --project "$REPOINVARIANT_ACTION_PATH" --frozen repoinvariant "${doctor_args[@]}"
            ;;
          false) ;;
          *) printf 'strict must be true or false, got %q\n' "$REPOINVARIANT_STRICT" >&2; exit 2 ;;
        esac

        args=(check --github-actions "--format=$REPOINVARIANT_FORMAT" "--fail-on=$REPOINVARIANT_FAIL_ON")
        if (( ${#selection_args[@]} )); then
          args+=("${selection_args[@]}")
        fi
        if [[ -n "$REPOINVARIANT_OUTPUT" ]]; then
          args+=("--output=$REPOINVARIANT_OUTPUT")
        fi
        args+=(-- "$REPOINVARIANT_PATH")
        uv run --project "$REPOINVARIANT_ACTION_PATH" --frozen repoinvariant "${args[@]}"
