name: RepoTruth
description: Catch environment and feature-traceability contract drift before merge.
author: xixvivji

branding:
  icon: check-circle
  color: purple

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: .
  config:
    description: Optional repository-relative configuration path.
    required: false
    default: ""
  format:
    description: Report format (text, json, markdown, or sarif).
    required: false
    default: text
  output:
    description: Optional report output path.
    required: false
    default: ""
  fail-on:
    description: Minimum blocking severity (error or warning).
    required: false
    default: error
  no-env:
    description: Set to true to skip environment-contract checks.
    required: false
    default: "false"
  no-features:
    description: Set to true to skip feature-traceability checks.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.0"
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Sync locked RepoTruth action dependencies
      shell: bash
      env:
        REPOTRUTH_ACTION_PATH: ${{ github.action_path }}
      run: uv sync --project "$REPOTRUTH_ACTION_PATH" --frozen --no-dev
    - name: Check repository contracts
      shell: bash
      env:
        REPOTRUTH_PATH: ${{ inputs.path }}
        REPOTRUTH_CONFIG: ${{ inputs.config }}
        REPOTRUTH_FORMAT: ${{ inputs.format }}
        REPOTRUTH_OUTPUT: ${{ inputs.output }}
        REPOTRUTH_FAIL_ON: ${{ inputs.fail-on }}
        REPOTRUTH_NO_ENV: ${{ inputs.no-env }}
        REPOTRUTH_NO_FEATURES: ${{ inputs.no-features }}
        REPOTRUTH_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -Eeuo pipefail

        args=(check "--format=$REPOTRUTH_FORMAT" "--fail-on=$REPOTRUTH_FAIL_ON")
        if [[ -n "$REPOTRUTH_CONFIG" ]]; then
          args+=("--config=$REPOTRUTH_CONFIG")
        fi
        if [[ -n "$REPOTRUTH_OUTPUT" ]]; then
          args+=("--output=$REPOTRUTH_OUTPUT")
        fi

        case "$REPOTRUTH_NO_ENV" in
          true) args+=(--no-env) ;;
          false) ;;
          *) printf 'no-env must be true or false, got %q\n' "$REPOTRUTH_NO_ENV" >&2; exit 2 ;;
        esac
        case "$REPOTRUTH_NO_FEATURES" in
          true) args+=(--no-features) ;;
          false) ;;
          *) printf 'no-features must be true or false, got %q\n' "$REPOTRUTH_NO_FEATURES" >&2; exit 2 ;;
        esac

        args+=(-- "$REPOTRUTH_PATH")
        uv run --project "$REPOTRUTH_ACTION_PATH" --frozen repotruth "${args[@]}"
