name: RepoTruth

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: repotruth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the local RepoTruth action
        uses: ./
        with:
          path: .
          format: sarif
          output: repotruth-report.sarif
          fail-on: error
          no-env: "false"
          no-features: "false"
      - name: Upload RepoTruth SARIF report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repotruth-sarif
          path: repotruth-report.sarif
          if-no-files-found: warn
          retention-days: 7
