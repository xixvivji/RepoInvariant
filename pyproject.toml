[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "repoinvariant"
dynamic = ["version"]
description = "Catch contract drift across documentation, configuration, specifications, and tests."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "xixvivji" },
]
keywords = ["ci", "configuration", "contract", "drift", "openapi", "traceability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "regex>=2024.11.6,<2027",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "hatchling==1.31.0",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=7,<8",
]

[project.scripts]
repoinvariant = "repoinvariant.cli:main"

[project.urls]
Homepage = "https://github.com/xixvivji/RepoInvariant"
Issues = "https://github.com/xixvivji/RepoInvariant/issues"
Source = "https://github.com/xixvivji/RepoInvariant"

[tool.hatch.build.targets.wheel]
packages = ["src/repoinvariant"]

[tool.hatch.version]
path = "src/repoinvariant/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
