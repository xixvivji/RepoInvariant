name: Bug report
description: Report a reproducible false positive, false negative, crash, or unsafe output.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic values only. Never paste credentials, private repository contents, or
        production configuration.
  - type: input
    id: version
    attributes:
      label: RepoInvariant version
      description: Paste `repoinvariant --version` output or an exact Action commit SHA.
      placeholder: "repoinvariant X.Y.Z or an exact commit SHA"
    validations:
      required: true
  - type: dropdown
    id: scanner
    attributes:
      label: Area
      options:
        - Environment contracts
        - Feature traceability
        - CLI or report format
        - GitHub Action
        - Packaging or release
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal synthetic reproducer
      description: Include the smallest safe files and command that demonstrate the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all secrets and private repository content from this report.
          required: true
