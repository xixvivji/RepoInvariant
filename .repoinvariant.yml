# yaml-language-server: $schema=https://raw.githubusercontent.com/xixvivji/RepoInvariant/main/schemas/repoinvariant-config-v1.schema.json
version: 1

env:
  contracts: []
  compose: []
  kubernetes: []
  workflows:
    - .github/workflows/*.yml
  spring: []
  ignore:
    - CI
    - HOME
    - PATH
    - PWD
    - SHELL
    - USER
    - GH_TOKEN
    - GITHUB_*
    - RELEASE_TAG
    - RUNNER_*
    - UV_*
    - PYTHON*

features:
  requirements: []
  specifications: []
  tests: []
  id_pattern: '\bREQ-[A-Z0-9][A-Z0-9-]*\b'
  openapi_extension: x-feature-id
  requirements_mode: definitions
  ignore: []

rules:
  ENV001: error
  ENV002: warning
  ENV003: warning
  TRACE001: error
  TRACE002: error
  TRACE003: error
  TRACE004: warning
