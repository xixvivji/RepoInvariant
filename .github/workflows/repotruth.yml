name: RepoTruth

on:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: repotruth check . --format sarif --output repotruth-report.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repotruth-sarif
          path: repotruth-report.sarif

